# ─────────────────────────────────────────────────────────────────────────────
# DEFAULT DENY ALL
# Applied to every namespace — blocks all traffic unless explicitly allowed
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tanilytics-gateway
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tanilytics-ingest
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tanilytics-stream
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tanilytics-processing
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tanilytics-storage
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tanilytics-query
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tanilytics-observe
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

# ─────────────────────────────────────────────────────────────────────────────
# GATEWAY NAMESPACE
# Accepts traffic from the internet
# Can reach ingest and query namespaces
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internet-ingress
  namespace: tanilytics-gateway
spec:
  podSelector:
    matchLabels:
      app: kong
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-ingest
  namespace: tanilytics-gateway
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-ingest
      ports:
        - port: 3000
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-query
  namespace: tanilytics-gateway
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-query
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 8082
          protocol: TCP

---
# Kong needs to reach its own PostgreSQL in tanilytics-storage
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-postgres
  namespace: tanilytics-gateway
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-storage
      ports:
        - port: 5432
          protocol: TCP

---
# DNS — every namespace needs this
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: tanilytics-gateway
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# ─────────────────────────────────────────────────────────────────────────────
# INGEST NAMESPACE
# Accepts traffic from gateway only
# Can reach stream (Redpanda) and its own Redis (Bloom filter)
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: tanilytics-ingest
spec:
  podSelector:
    matchLabels:
      app: ingestion-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-gateway
      ports:
        - port: 3000
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-redpanda
  namespace: tanilytics-ingest
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-stream
      ports:
        - port: 9092
          protocol: TCP
        - port: 9644
          protocol: TCP

---
# Ingest can reach its own Redis (Bloom filter)
# Same namespace so use podSelector
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-redis-bloom
  namespace: tanilytics-ingest
spec:
  podSelector:
    matchLabels:
      app: ingestion-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: tanilytics-ingest
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# ─────────────────────────────────────────────────────────────────────────────
# STREAM NAMESPACE (Redpanda)
# Accepts connections from ingest and processing only
# No egress needed — Redpanda is a passive receiver
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-ingest-and-processing
  namespace: tanilytics-stream
spec:
  podSelector:
    matchLabels:
      app: redpanda
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-ingest
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-processing
      ports:
        - port: 9092
          protocol: TCP
        - port: 9644
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: tanilytics-stream
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# ─────────────────────────────────────────────────────────────────────────────
# PROCESSING NAMESPACE
# Can reach stream (consume events) and storage (write results)
# Also reaches Redis in ingest namespace for real-time counters
# No inbound traffic from other services
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-stream
  namespace: tanilytics-processing
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-stream
      ports:
        - port: 9092
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-storage
  namespace: tanilytics-processing
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-storage
      ports:
        - port: 9000
          protocol: TCP
        - port: 8123
          protocol: TCP

---
# Processing writes real-time counters to Redis in ingest namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-redis-ingest
  namespace: tanilytics-processing
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-ingest
      ports:
        - port: 6379
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: tanilytics-processing
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# ─────────────────────────────────────────────────────────────────────────────
# STORAGE NAMESPACE
# Accepts connections from processing (writes) and query (reads) only
# This is the most important policy — protects raw event data
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-clickhouse
  namespace: tanilytics-storage
spec:
  podSelector:
    matchLabels:
      app: clickhouse
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-processing
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-query
      ports:
        - port: 9000
          protocol: TCP
        - port: 8123
          protocol: TCP

---
# PostgreSQL accepts from gateway (Kong DB) and query namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-postgres
  namespace: tanilytics-storage
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-query
      ports:
        - port: 5432
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: tanilytics-storage
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# ─────────────────────────────────────────────────────────────────────────────
# QUERY NAMESPACE
# Accepts traffic from gateway
# Can reach storage (ClickHouse, PostgreSQL) and ingest (Redis counters)
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: tanilytics-query
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-gateway
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 8082
          protocol: TCP

---
# Internal communication between query namespace services
# Auth, query, privacy services call each other
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: tanilytics-query
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-query
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-query

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-storage
  namespace: tanilytics-query
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-storage
      ports:
        - port: 9000
          protocol: TCP
        - port: 8123
          protocol: TCP
        - port: 5432
          protocol: TCP

---
# Query reads real-time counters from Redis in ingest namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-redis
  namespace: tanilytics-query
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-ingest
      ports:
        - port: 6379
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: tanilytics-query
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# ─────────────────────────────────────────────────────────────────────────────
# OBSERVE NAMESPACE
# Prometheus needs to scrape metrics from all namespaces
# Grafana needs to reach Prometheus and Loki
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-ingest
  namespace: tanilytics-ingest
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-observe
      ports:
        - port: 9090
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-processing
  namespace: tanilytics-processing
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-observe
      ports:
        - port: 9090
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-storage
  namespace: tanilytics-storage
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-observe
      ports:
        - port: 9090
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-query
  namespace: tanilytics-query
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-observe
      ports:
        - port: 9090
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-gateway
  namespace: tanilytics-gateway
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-observe
      ports:
        - port: 9090
          protocol: TCP

---
# Observe namespace can reach everything for scraping
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-scrape-all
  namespace: tanilytics-observe
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-ingest
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-processing
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-storage
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-query
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tanilytics-stream
      ports:
        - port: 9090
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: tanilytics-observe
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP