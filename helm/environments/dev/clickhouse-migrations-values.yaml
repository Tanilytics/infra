job:
  name: clickhouse-migrations
  backoffLimit: 3
  restartPolicy: Never
  image: clickhouse/clickhouse-server:latest
  env:
    - name: CLICKHOUSE_USER
      valueFrom:
        secretKeyRef:
          name: clickhouse-credentials
          key: user
    - name: CLICKHOUSE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: clickhouse-credentials
          key: password
    - name: CLICKHOUSE_HOST
      value: "clickhouse-clickhouse.tanilytics-storage.svc.cluster.local"
  command:
    - /bin/bash
    - /migrations-runner/run-migrations.sh
  volumeMounts:
    - name: migrations
      mountPath: /migrations
    - name: migrations-runner
      mountPath: /migrations-runner
  volumes:
    - name: migrations
      configMap:
        name: clickhouse-migrations
    - name: migrations-runner
      configMap:
        name: clickhouse-migrations-runner
        defaultMode: 0755
  migrations:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi