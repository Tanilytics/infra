{{- $isClickhouse := or .Values.job.migrations.enabled (contains "clickhouse" .Release.Name) }}
{{- if $isClickhouse }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-migrations-runner
  namespace: {{ .Release.Namespace }}
  labels:
    app: clickhouse-migrations
data:
  run-migrations.sh: |
    #!/bin/bash
    set -e

    # ClickHouse connection parameters
    CLICKHOUSE_HOST="${CLICKHOUSE_HOST:-clickhouse-clickhouse.tanilytics-storage.svc.cluster.local}"
    CLICKHOUSE_USER="${CLICKHOUSE_USER:-default}"
    CLICKHOUSE_PASSWORD="${CLICKHOUSE_PASSWORD}"

    # Migration directory
    MIGRATION_DIR="/migrations"

    # Color output
    RED='\\033[0;31m'
    GREEN='\\033[0;32m'
    YELLOW='\\033[1;33m'
    NC='\\033[0m' # No Color

    log_info() {
      echo -e "${GREEN}[INFO]${NC} $1"
    }

    log_error() {
      echo -e "${RED}[ERROR]${NC} $1"
    }

    log_warn() {
      echo -e "${YELLOW}[WARN]${NC} $1"
    }

    # Verify migrations directory exists
    if [ ! -d "$MIGRATION_DIR" ]; then
      log_error "Migrations directory not found: $MIGRATION_DIR"
      exit 1
    fi

    log_info "Starting ClickHouse migrations..."
    log_info "ClickHouse Host: $CLICKHOUSE_HOST"
    log_info "ClickHouse User: $CLICKHOUSE_USER"

    # Find and sort all .up.sql files numerically
    migration_files=($(find "$MIGRATION_DIR" -name "*.up.sql" | sort -V))

    if [ ${#migration_files[@]} -eq 0 ]; then
      log_warn "No migration files found in $MIGRATION_DIR"
      exit 0
    fi

    log_info "Found ${#migration_files[@]} migration(s) to execute"

    # Execute each migration
    failed_migrations=()
    executed_migrations=()

    for migration_file in "${migration_files[@]}"; do
      migration_name=$(basename "$migration_file")
      log_info "Executing migration: $migration_name"

      # Execute migration
      if clickhouse-client \\
        -h "$CLICKHOUSE_HOST" \\
        --user "$CLICKHOUSE_USER" \\
        --password "$CLICKHOUSE_PASSWORD" \\
        --multiquery < "$migration_file"; then
        log_info "✓ Migration completed: $migration_name"
        executed_migrations+=("$migration_name")
      else
        log_error "✗ Migration failed: $migration_name"
        failed_migrations+=("$migration_name")
      fi
    done

    # Summary
    echo ""
    log_info "Migration execution summary:"
    log_info "Executed: ${#executed_migrations[@]}"
    if [ ${#failed_migrations[@]} -gt 0 ]; then
      log_error "Failed: ${#failed_migrations[@]}"
      for failed in "${failed_migrations[@]}"; do
        log_error "  - $failed"
      done
      exit 1
    else
      log_info "All migrations completed successfully!"
      exit 0
    fi
{{- end }}
