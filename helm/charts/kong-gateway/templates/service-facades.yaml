# These are proxy services in the gateway namespace
# that point to the real services in other namespaces

apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: tanilytics-gateway
spec:
  type: ExternalName
  externalName: ingestion.tanilytics-ingest.svc.cluster.local
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: tanilytics-gateway
spec:
  type: ExternalName
  externalName: auth-service.tanilytics-query.svc.cluster.local
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: query-service
  namespace: tanilytics-gateway
spec:
  type: ExternalName
  externalName: query-service-query-service.tanilytics-query.svc.cluster.local
  ports:
    - port: 8081
      targetPort: 8080

