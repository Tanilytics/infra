apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tanilytics-alerts
  namespace: tanilytics-observe
  labels:
    release: kube-prometheus-stack
spec:
  groups:

    # ── Ingestion alerts ───────────────────────────────────────────────────────
    - name: ingestion
      rules:
        - alert: IngestionDown
          expr: up{job="ingestion-service"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Ingestion service is down"
            description: "Events are not being received. SDK data is being lost."

        - alert: IngestionThroughputDrop
          expr: |
            rate(tanilytics_events_received_total[5m]) 
            rate(tanilytics_events_received_total[5m] offset 1h) * 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Event ingestion dropped by 50%"
            description: "Current rate is less than half of what it was 1 hour ago."

    # ── Consumer lag alerts ────────────────────────────────────────────────────
    - name: streaming
      rules:
        - alert: KafkaConsumerLagHigh
          expr: tanilytics_consumer_lag > 10000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Redpanda consumer lag is high"
            description: "Processing is {{ "{{" }} $value {{ "}}" }} events behind ingestion."

        - alert: KafkaConsumerLagCritical
          expr: tanilytics_consumer_lag > 100000
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Redpanda consumer lag is critical"
            description: "Processing is {{ "{{" }} $value {{ "}}" }} events behind. Data delay is growing."

    # ── ClickHouse alerts ──────────────────────────────────────────────────────
    - name: storage
      rules:
        - alert: ClickhouseInsertSlow
          expr: |
            histogram_quantile(0.95,
              rate(tanilytics_clickhouse_insert_duration_seconds_bucket[5m])
            ) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ClickHouse inserts are slow (p95 > 2s)"
            description: "ClickHouse may be under pressure or disk is slow."

        - alert: ClickhouseDiskHigh
          expr: |
            kubelet_volume_stats_used_bytes{namespace="tanilytics-storage"}
            / kubelet_volume_stats_capacity_bytes{namespace="tanilytics-storage"}
            > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ClickHouse disk usage above 80%"
            description: "Current usage is {{ "{{" }} $value | humanizePercentage {{ "}}" }}."

    # ── Query latency alerts ───────────────────────────────────────────────────
    - name: query
      rules:
        - alert: DashboardQuerySlow
          expr: |
            histogram_quantile(0.95,
              rate(tanilytics_query_duration_seconds_bucket[5m])
            ) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Dashboard queries are slow (p95 > 500ms)"
            description: "NFR-1.2 target is 500ms. Currently at {{ "{{" }} $value {{ "}}" }}s."

    # ── Pod health alerts ──────────────────────────────────────────────────────
    - name: pods
      rules:
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} is crash looping"
            description: "Pod in namespace {{ "{{" }} $labels.namespace {{ "}}" }} has restarted recently."

        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{condition="false",
              namespace=~"tanilytics-.*"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ "{{" }} $labels.pod {{ "}}" }} is not ready"

    # ── Kong gateway alerts ────────────────────────────────────────────────────
    - name: gateway
      rules:
        - alert: KongHighErrorRate
          expr: |
            rate(kong_http_requests_total{code=~"5.."}[5m])
            / rate(kong_http_requests_total[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Kong 5xx error rate above 5%"
            description: "Gateway is returning server errors to clients."