namespace: tanilytics-query
replicaCount: 1
spring:
  profilesActive: docker
image:
  repository: tanilytics/query-service
  pullPolicy: Always
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8081
  containerPort: 8081

spring:
  profilesActive: docker

redis:
  host: redis-master.tanilytics-ingest.svc.cluster.local
  port: "6379"

clickhouse:
  host: clickhouse.tanilytics-storage.svc.cluster.local
  port: "8123"
  database: default
authService:
  baseUrl: http://auth-service.tanilytics-query.svc.cluster.local:8082

jwt:
  secret: change-me-in-production-use-at-least-256-bits

otel:
  endpoint: http://otel-collector:4317

resources: {}
resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 400m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

secrets:
  create: false
  data: {}
