# The signing secret Kong uses to verify JWTs
# Must match what your auth service uses to sign tokens

apiVersion: v1
kind: Secret
metadata:
  name: jwt-signing-secret
  namespace: tanilytics-gateway
  labels:
    konghq.com/credential: jwt
type: Opaque
stringData:
  key: "dashboard-users"
  algorithm: "HS256"
  secret: "REPLACE_WITH_ACTUAL_SECRET_VIA_EXTERNAL_SECRETS"